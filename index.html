<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Terminal - Infra & System</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .terminal-header {
            background-color: #21262d;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #30363d;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }
        .terminal-title { margin-left: 10px; font-size: 0.9rem; color: #8b949e; font-weight: bold; }

        .content {
            padding: 25px;
        }
        h1 { color: #58a6ff; margin-top: 0; font-size: 1.6rem; }
        p { line-height: 1.5; color: #8b949e; font-size: 0.95rem; }

        .cli-container {
            background-color: #0b0f13;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-family: inherit;
        }
        .cli-history {
            max-height: 180px;
            overflow-y: auto;
            font-size: 0.9rem;
            color: #c9d1d9;
            margin-bottom: 10px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .cli-input-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cli-prompt { color: #58a6ff; font-weight: bold; white-space: nowrap; }
        .cli-input {
            background: none;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            flex-grow: 1;
        }
        .hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #8b949e;
            text-align: center;
        }
        .highlight { color: #7ee787; }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-header">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
            <span class="terminal-title" id="top-terminal-path">guest@192.168.1.10:~</span>
        </div>

        <div class="content">
            <h1>💻 시스템 인프라 CLI 콘솔</h1>
            <p>환영합니다! 가상 서버 터미널 환경입니다. 간단한 명령어를 입력하여 시스템을 조회하거나 이스터에그를 찾아보세요.</p>

            <!-- 터미널 CLI 영역 -->
            <div class="cli-container">
                <div class="cli-history" id="cli-history">
                    <div>시스템 부팅 완료... <span class="highlight">help</span>를 입력해 사용 가능한 명령어를 확인하세요.</div>
                </div>
                <div class="cli-input-line">
                    <span class="cli-prompt" id="cli-prompt-text">guest@infra ~ $</span>
                    <input type="text" class="cli-input" id="cli-input" autofocus placeholder="명령어를 입력하세요...">
                </div>
            </div>

            <div class="hint">
                💡 팁: 루트 권한을 얻고 싶다면 <span style="color: #ff7b72; font-weight: bold;">su</span>를 입력해보세요!
            </div>
        </div>
    </div>

    <script>
        const cliInput = document.getElementById('cli-input');
        const cliHistory = document.getElementById('cli-history');
        const promptText = document.getElementById('cli-prompt-text');
        const topPath = document.getElementById('top-terminal-path');

        let currentDir = '~';

        const excuses = [
            "제 Local에서는 정상 작동했는데요?",
            "누가 캐시(Cache) 건드렸습니까?",
            "아마존(AWS) 서버 장애인 것 같습니다.",
            "분명 어제까지는 문제 없었는데 갑자기 이러네요.",
            "잠시만요, 제 컴퓨터가 아니라 원격 서버 문제입니다."
        ];

        // 페이지 클릭 시 인풋박스로 포커스 유지
        document.addEventListener('click', () => {
            cliInput.focus();
        });

        cliInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const fullCmd = cliInput.value.trim();
                if (!fullCmd) return;

                // 명령어와 인자값 분리
                const tokens = fullCmd.split(' ');
                const mainCmd = tokens[0].toLowerCase();
                const arg = tokens[1];

                // 명령어 내역 출력
                appendCliOutput(`${promptText.textContent} ${fullCmd}`, '#8b949e');

                // 명령어 분기 처리
                switch(mainCmd) {
                    case 'help':
                        appendCliOutput('사용 가능 명령어: ls, cd [경로], ping, reboot, excuse, su, clear', '#79c0ff');
                        break;
                    case 'ls':
                        appendCliOutput('data/   home/   app/   logs/   conf/   secret_key.txt(🔒)', '#7ee787');
                        break;
                    case 'ping':
                        appendCliOutput('pong! (서버 응답 속도: 0.4ms - 지극히 평화로움)', '#7ee787');
                        break;
                    case 'reboot':
                        appendCliOutput('🚨 [CRITICAL] 농담이시죠? 운영 서버는 재부팅 금지입니다!', '#ff5f56');
                        break;
                    case 'excuse':
                        const randomExcuse = excuses[Math.floor(Math.random() * excuses.length)];
                        appendCliOutput(`💡 엔지니어의 만능 핑계: "${randomExcuse}"`, '#ffa657');
                        break;
                    case 'su': // su.html로 넘어가는 이스터 에그 명령어
                        appendCliOutput('🔑 루트(root) 권한 인증 중... su.html로 안전하게 연결합니다.', '#ffbd2e');
                        setTimeout(() => {
                            window.location.href = 'su.html';
                        }, 800);
                        break;
                    case 'cd':
                        if (!arg || arg === '~') {
                            currentDir = '~';
                            updatePrompt();
                            appendCliOutput('🏠 홈 디렉토리로 이동했습니다. (안전함)', '#7ee787');
                        } else if (arg === 'home' || arg === './home') {
                            currentDir = '~/home';
                            updatePrompt();
                            appendCliOutput('📂 home 디렉토리 진입: 특별한 건 없습니다.', '#79c0ff');
                        } else if (arg === 'app' || arg === './app') {
                            currentDir = '~/app';
                            updatePrompt();
                            appendCliOutput('☕ app 디렉토리 진입: 배포 소스가 모여있는 곳입니다.', '#79c0ff');
                        } else if (arg === 'data' || arg === './data') {
                            appendCliOutput('zsh: permission denied: data 🚫 (앗! 일반 사용자는 접근 권한이 없습니다)', '#ff5f56');
                        } else if (arg === 'logs' || arg === './logs') {
                            currentDir = '~/logs';
                            updatePrompt();
                            appendCliOutput('📜 logs 디렉토리 진입: 시스템 로그 모음.', '#ffa657');
                        } else if (arg === 'conf' || arg === './conf') {
                            currentDir = '~/conf';
                            updatePrompt();
                            appendCliOutput('⚙️ conf 디렉토리 진입: 서버 설정 파일 영역.', '#79c0ff');
                        } else if (arg.startsWith('/root') || arg.startsWith('/etc')) {
                            appendCliOutput(`zsh: permission denied: ${arg} (루트 권한이 필요합니다. 'su'를 시도해보세요!)`, '#ff5f56');
                        } else {
                            appendCliOutput(`zsh: no such file or directory: ${arg}`, '#ff5f56');
                        }
                        break;
                    case 'clear':
                        cliHistory.innerHTML = '';
                        break;
                    default:
                        appendCliOutput(`zsh: command not found: ${mainCmd}. 'help'를 입력해보세요.`, '#ff5f56');
                }

                cliInput.value = '';
                cliHistory.scrollTop = cliHistory.scrollHeight;
            }
        });

        function appendCliOutput(text, color) {
            const div = document.createElement('div');
            div.style.color = color;
            div.textContent = text;
            cliHistory.appendChild(div);
        }

        function updatePrompt() {
            promptText.textContent = `guest@infra ${currentDir} $`;
            topPath.textContent = `guest@192.168.1.10:${currentDir}`;
        }
    </script>
</body>
</html>
